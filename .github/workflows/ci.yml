name: Cross-platform framework CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository suite
        run: python -B -m unittest discover -s . -v
      - name: Run Vibe Coding Designer suite
        run: python -B -m unittest discover -s applications/vibe-coding-designer/tests -v
      - name: Check patch whitespace
        run: git diff --check
