name: Cross-platform framework CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository suite
        run: python -B -m unittest discover -s . -v
      - name: Run Vibe Coding Designer suite
        run: python -B -m unittest discover -s applications/vibe-coding-designer/tests -v
      - name: Run every application verification profile
        run: python -B scripts/verify_extraction.py --all
      - name: Display aggregate verification report on failure
        if: failure()
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path .tmp/verification -Recurse -Filter report.json |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -ne $report) {
            Get-Content -LiteralPath $report.FullName -Raw
          }
      - name: Verify published Growing With Children artifact
        shell: pwsh
        run: |
          $marketplacePath = Join-Path $env:RUNNER_TEMP 'obvious-one-plugins'
          git clone --depth 1 https://github.com/schao523/obvious-one-plugins.git $marketplacePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/verify_extraction.py --application growing-with-children --marketplace $marketplacePath
          exit $LASTEXITCODE
      - name: Check patch whitespace
        run: git diff --check
